[project]
name = "project-creator-core"
version = "0.0.1"
description = "ADHD Framework core: project_creator_core"
requires-python = ">=3.11"
dependencies = [
    "config-manager",
    "logger-util",
    "creator-common-core",
    "exceptions-core",
    "github-api-core",
    "questionary-core",
    "yaml-reading-core",
]

[project.urls]
Repository = "https://github.com/AI-Driven-Highspeed-Development/project_creator_core.git"

[tool.adhd]
type = "core"
layer = "dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
dev-mode-dirs = [".."]
