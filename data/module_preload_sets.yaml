# Module Preload Sets
# Defines modules that are automatically added to new ADHD Framework projects.
#
# - `always`: Modules installed in every new project (core dependencies)
# - `options`: Named sets that users can optionally select during project creation

always:
  - https://github.com/AI-Driven-Highspeed-Development/Config-Manager.git
  - https://github.com/AI-Driven-Highspeed-Development/Logger-Util.git
  - https://github.com/AI-Driven-Highspeed-Development/workspace_core.git
  - https://github.com/AI-Driven-Highspeed-Development/instruction_core.git
  - https://github.com/AI-Driven-Highspeed-Development/adhd_mcp.git
  - https://github.com/AI-Driven-Highspeed-Development/creator_common_core.git
  - https://github.com/AI-Driven-Highspeed-Development/exceptions_core.git
  - https://github.com/AI-Driven-Highspeed-Development/github_api_core.git
  - https://github.com/AI-Driven-Highspeed-Development/module_creator_core.git
  - https://github.com/AI-Driven-Highspeed-Development/modules_controller_core.git
  - https://github.com/AI-Driven-Highspeed-Development/yaml_reading_core.git
  - https://github.com/AI-Driven-Highspeed-Development/temp_files_manager.git
  - https://github.com/AI-Driven-Highspeed-Development/questionary_core.git

options:
  Default:
    description: The rawest form of freedom with minimal things in it.
  HyperPM:
    description: Adding HyperPM for AI agentic project management!
    urls:
      - https://github.com/AI-Driven-Highspeed-Development/hyperpm_core.git
  Webcams:
    description: Webcam control modules
    urls:
      - https://github.com/AI-Driven-Highspeed-Development/Webcam-Plugin.git
  Comfyui:
    description: Comfyui API
    urls:
      - https://github.com/AI-Driven-Highspeed-Development/ComfyUI-Plugin.git